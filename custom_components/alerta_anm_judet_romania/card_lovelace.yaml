type: conditional
conditions:
  - condition: state
    entity: sensor.mesaj_meteo_galati
    state: alerta
card:
  type: custom:fold-entity-row
  padding: 0
  clickable: true
  head:
    type: custom:button-card
    entity: sensor.avertizari_meteo_anm
    name: AVERTIZARE METEO
    icon: mdi:alert
    show_name: true
    show_icon: true
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - background-color: transparent
        - box-shadow: none
        - padding: 0px
        - margin: 0px
        - pointer-events: none
      icon:
        - width: 22px
        - height: 22px
        - color: |
            [[[
              // Determină culoarea celui mai grav cod din mesaj
              const mesajEntityId = 'sensor.mesaj_meteo_galati';
              const mesajEntity = states[mesajEntityId];
              const text_complet = (mesajEntity && mesajEntity.attributes) ? (mesajEntity.attributes.mesaj_complet || '') : '';
              
              let maxSeverity = -1;
              let iconColor = '#3498db'; // Default albastru
              
              // Severity mapping: rosu=3, portocaliu=2, galben=1, informare=0
              if (text_complet.toLowerCase().includes('rosu') || text_complet.toLowerCase().includes('roșu')) {
                maxSeverity = 3;
                iconColor = '#ea3323';
              } else if (text_complet.toLowerCase().includes('portocaliu')) {
                if (maxSeverity < 2) { maxSeverity = 2; iconColor = '#f09035'; }
              } else if (text_complet.toLowerCase().includes('galben')) {
                if (maxSeverity < 1) { maxSeverity = 1; iconColor = '#ffde07'; }
              }
              
              return iconColor;
            ]]]
      name:
        - font-weight: 900
        - font-size: 16px
        - text-transform: uppercase
        - color: |
            [[[
              // Determină culoarea celui mai grav cod din mesaj
              const mesajEntityId = 'sensor.mesaj_meteo_galati';
              const mesajEntity = states[mesajEntityId];
              const text_complet = (mesajEntity && mesajEntity.attributes) ? (mesajEntity.attributes.mesaj_complet || '') : '';
              
              let maxSeverity = -1;
              let titleColor = '#3498db'; // Default albastru
              
              // Severity mapping: rosu=3, portocaliu=2, galben=1, informare=0
              if (text_complet.toLowerCase().includes('rosu') || text_complet.toLowerCase().includes('roșu')) {
                maxSeverity = 3;
                titleColor = '#ea3323';
              } else if (text_complet.toLowerCase().includes('portocaliu')) {
                if (maxSeverity < 2) { maxSeverity = 2; titleColor = '#f09035'; }
              } else if (text_complet.toLowerCase().includes('galben')) {
                if (maxSeverity < 1) { maxSeverity = 1; titleColor = '#ffde07'; }
              }
              
              return titleColor;
            ]]]
  entities:
    - type: custom:button-card
      entity: sensor.mesaj_meteo_galati
      show_name: false
      show_label: true
      show_state: false
      show_icon: false
      label: |
        [[[
          // --- CONFIGURARE INIȚIALĂ ---
          const mesajEntityId = 'sensor.mesaj_meteo_galati';
          const mesajEntity = states[mesajEntityId];
          const text_complet = (mesajEntity && mesajEntity.attributes) ? (mesajEntity.attributes.mesaj_complet || '') : '';

          // Preluare ID-uri avertizări pentru hărți
          const sensor_ids = states['sensor.anm_avertizare_id'];
          let lista_ids = [];
          if (sensor_ids && sensor_ids.state && !['0', 'unavailable', 'unknown'].includes(sensor_ids.state)) {
              lista_ids = sensor_ids.state.split(',').map(s => s.trim()).filter(s => s !== '').reverse();
          }

          // Preluare culori hărți
          const colorSensors = Object.keys(states).filter(key => key.startsWith('sensor.culoare_harta_'));
          const sensor_colors = colorSensors.length > 0 ? states[colorSensors[0]] : null;
          const map_colors = (sensor_colors && sensor_colors.attributes && sensor_colors.attributes.date_harti) ? sensor_colors.attributes.date_harti : {};

          // Preluare nume județ
          let numeJudet = 'Galați';
          try {
            if (mesajEntity && mesajEntity.attributes && mesajEntity.attributes.friendly_name) {
              numeJudet = mesajEntity.attributes.friendly_name.replace(/Mesaj Meteo\s*/i, '') || numeJudet;
            }
          } catch (e) {}
          
          let html_final = '';
          let ids_utilizate = [];

          // --- LOGICA DE PROCESARE A MESAJELOR ---
          // Regex hibrid: caută AMBELE formate, "MESAJ X" SAU "INFORMARE/ATENȚIONARE"
          const regex = /(?:(MESAJ\s+\d+)|(INFORMARE METEOROLOGICĂ|ATENȚIONARE METEOROLOGICĂ))([\s\S]*?)(?=(?:MESAJ\s+\d+|INFORMARE METEOROLOGICĂ|ATENȚIONARE METEOROLOGICĂ)|$)/gi;
          let match;

          while ((match = regex.exec(text_complet)) !== null) {
              // Stabilim titlul și conținutul mesajului
              const titlu_afisat = (match[1] || match[2]).trim(); // match[1] este "MESAJ X", match[2] este "INFORMARE..."
              const msg = match[3];
              const msg_lower = msg.toLowerCase();

              // Funcție de normalizare text (eliminare diacritice)
              const normalize = (s) => {
                if (!s) return '';
                s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                return s.replace(/[șşŞȘ]/g, 's').replace(/[țţȚŢ]/g, 't').replace(/[ăĂ]/g, 'a').replace(/[âÂ]/g, 'a').replace(/[îÎ]/g, 'i').toLowerCase();
              };

              // Verificarea relevanței mesajului pentru județul/regiunea selectată
              const countyLower = normalize(numeJudet);
              const msg_norm = normalize(msg);
              const isGeneral = /informare|atentionare/.test(normalize(titlu_afisat));
              const regiuniRelevante = [countyLower, 'moldova', 'sud-est', 'sudul moldovei', 'estul tarii', 'est', 'estul transilvaniei'];
              const mentionsRegion = regiuniRelevante.some(regiune => msg_norm.includes(regiune));

              // Se afișează dacă e mesaj general (informare) SAU dacă menționează regiunea
              if (!isGeneral && !mentionsRegion) {
                continue; // Treci la următorul mesaj dacă nu e relevant
              }

              // Stabilirea culorii pentru evidențiere
              let colorKey = '';
              let highlightColor = '#3498db'; // Albastru pentru informare (default)
              if (msg_lower.includes('rosu') || msg_lower.includes('roșu')) { highlightColor = '#ea3323'; colorKey = 'rosu'; }
              else if (msg_lower.includes('portocaliu')) { highlightColor = '#f09035'; colorKey = 'portocaliu'; }
              else if (msg_lower.includes('galben')) { highlightColor = '#ffde07'; colorKey = 'galben'; }
              else if (isGeneral) { colorKey = 'informare'; } // Marchează informările pentru afișare hartă

              // Formatarea textului mesajului
              let msg_fmt = msg.replace(/COD GALBEN|COD PORTOCALIU|COD ROSU/gi, '')
                       .replace(/(\d{2})(Fenomene)/g, '$1<br>$2')
                       .replace(/(viscol)(Zone)/g, '$1<br>$2')
                       .replace(/Interval de valabilitate:?/g, `<br>• <b style="color: ${highlightColor}">Interval:</b>`)
                       .replace(/Fenomene(?: și zone)? vizate:?/g, `<br>• <b style="color: ${highlightColor}">Fenomene:</b>`)
                       .replace(/Zone afectate:?/g, `<br>• <b style="color: ${highlightColor}">Zone:</b>`)
                       .trim();

              const regexHighlight = new RegExp(`(${numeJudet}|Moldova|sud-est|sudul Moldovei|estul Transilvaniei)`, 'gi');
              msg_fmt = msg_fmt.replace(regexHighlight, `<b style="text-decoration: underline; color: ${highlightColor};">$&</b>`);

              // Construirea HTML-ului pentru mesaj
              html_final += `<div style="margin-bottom: 15px; border-left: 4px solid ${highlightColor}; padding-left: 10px;">
                              <div style="font-weight: 900; color: ${highlightColor}; margin-bottom: 5px; text-transform: uppercase;">
                                ${titlu_afisat.replace(/COD/gi, '')}
                                ${colorKey === 'galben' ? '<span style="background-color: #ffde07; color: black; padding: 1px 3px; border-radius: 3px; font-weight: bold;">COD GALBEN</span>' : ''}
                                ${colorKey === 'portocaliu' ? '<span style="background-color: #f09035; color: black; padding: 1px 3px; border-radius: 3px; font-weight: bold;">COD PORTOCALIU</span>' : ''}
                                ${colorKey === 'rosu' ? '<span style="background-color: #ea3323; color: white; padding: 1px 3px; border-radius: 3px; font-weight: bold;">COD ROȘU</span>' : ''}
                              </div>
                              <div style="line-height: 1.4;">${msg_fmt}</div>
                             </div>`;

              // --- LOGICA PENTRU AFIȘARE HARTĂ ---
              // Afișează harta dacă judetul are vreun cod de alertă (rosu, portocaliu, galben, informare)
              let hasAlert = ['rosu', 'portocaliu', 'galben', 'informare'].includes(colorKey);
              
              if (hasAlert && lista_ids.length > 0) {
                  let id_gasit = lista_ids.find(id => !ids_utilizate.includes(id));
                  if (id_gasit) {
                      ids_utilizate.push(id_gasit); // Marchează ID-ul ca fiind folosit
                      let url_img = `/local/harta_anm_${id_gasit}.svg?v=${new Date().getTime()}`;
                      // Construirea HTML-ului pentru hartă
                      html_final += `<div style="margin-bottom: 30px; padding: 0 10px; text-align: center;">
                                       <div style="font-size: 11px; font-weight: bold; color: ${highlightColor}; margin-bottom: 5px; text-transform: uppercase;">Harta Aferentă</div>
                                       <img src="${url_img}" style="width: 90%; display: block; margin: 0 auto; border-radius: 8px; border: 1.5px solid ${highlightColor}; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">
                                     </div>`;
                  }
              }
          }

          return html_final || 'Nu sunt mesaje de afișat.';
        ]]]
      styles:
        card:
          - padding: 16px
          - border-radius: 12px
        label:
          - text-align: left
          - font-size: 13px
          - white-space: normal
      tap_action:
        action: url
        url_path: https://www.meteoromania.ro/avertizari/
